services:
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:latest
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  configsvr01:
    image: mongo:4.4
    container_name: configsvr01
    command: ["/scripts/config-setup.sh"]
    volumes:
      - ./sharding-scripts:/scripts
    networks:
      - mongo-cluster

  shard01:
    image: mongo:4.4
    container_name: shard01
    command: ["/scripts/shard1-setup.sh"]
    volumes:
      - ./sharding-scripts:/scripts
    networks:
      - mongo-cluster

  shard02:
    image: mongo:4.4
    container_name: shard02
    command: ["/scripts/shard2-setup.sh"]
    volumes:
      - ./sharding-scripts:/scripts
    networks:
      - mongo-cluster

  mongos:
    image: mongo:4.4
    container_name: mongos
    depends_on:
      - configsvr01
      - shard01
      - shard02
    command: ["/scripts/mongos-setup.sh"]
    volumes:
      - ./sharding-scripts:/scripts
    ports:
      - 27017:27017
    networks:
      - mongo-cluster

networks:
  mongo-cluster: